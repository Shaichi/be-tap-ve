name: Bé Tập Vẽ Tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run COMET test suite
        env:
          COMET_TEST_PNG: "0"
        run: python comet-uml-drawio/tests/run_tests.py
